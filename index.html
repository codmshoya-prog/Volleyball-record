<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>배구부 데이터 분석 - 내 팀</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f8f9fa;--bg3:#f1f3f5;
  --text:#212529;--text2:#6c757d;--text3:#adb5bd;
  --border:rgba(0,0,0,.10);--border2:rgba(0,0,0,.18);
  --blue:#185FA5;--blue-bg:#E6F1FB;
  --amber:#854F0B;--amber-bg:#FAEEDA;
  --red:#A32D2D;--red-bg:#FCEBEB;
  --radius:8px;--radius-lg:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;background:var(--bg3);color:var(--text);font-size:14px}
.header{background:var(--bg);border-bottom:1px solid var(--border);padding:32px 24px}
.header-inner{max-width:960px;margin:0 auto}
.header-top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.header h1{font-size:24px;font-weight:700;margin-bottom:6px}
.header p{font-size:14px;color:var(--text2);margin-bottom:20px}
.guide-btn{flex-shrink:0}
.search-row{display:flex;gap:10px}
.search-row input{flex:1;font-size:14px;padding:11px 14px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg2);color:var(--text)}
.search-row input:focus{outline:2px solid var(--blue);outline-offset:1px}
.btn{padding:10px 18px;font-size:13px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg);color:var(--text);cursor:pointer;font-weight:600;transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--bg2)}
.btn-p{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn-p:hover{opacity:.85}
.content{max-width:960px;margin:0 auto;padding:28px 16px 100px}
.section-title{font-size:14px;font-weight:700;color:var(--text2);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:32px}
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;cursor:pointer;transition:box-shadow .15s,border-color .15s;position:relative;text-decoration:none;color:inherit;display:block}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);border-color:var(--border2)}
.card-name{font-size:15px;font-weight:700;margin-bottom:4px;padding-right:28px}
.card-meta{font-size:12px;color:var(--text3)}
.remove-btn{position:absolute;top:12px;right:12px;background:none;border:none;font-size:16px;cursor:pointer;color:var(--text3);line-height:1;padding:4px;border-radius:6px}
.remove-btn:hover{color:var(--red);background:var(--red-bg)}
.empty{text-align:center;padding:50px 20px;color:var(--text3);font-size:14px;line-height:1.7}
.actions{position:fixed;bottom:28px;right:28px;z-index:100;display:flex;gap:10px}
.actions button{padding:14px 20px;font-size:14px;border-radius:99px;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex}
.modal{background:var(--bg);border-radius:var(--radius-lg);width:min(440px,100%);padding:24px;box-shadow:0 8px 40px rgba(0,0,0,.18)}
.modal-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-title{font-size:16px;font-weight:700}
.x-btn{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text2);line-height:1}
.fgrp{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fgrp label{font-size:12px;font-weight:600;color:var(--text2)}
.fgrp input{font-size:13px;padding:9px 11px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg2);color:var(--text);width:100%}
.fgrp input:focus{outline:2px solid var(--blue);outline-offset:1px}
.fgrp .hint{font-size:11px;color:var(--text3);margin-top:2px}
.modal-ft{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border)}
.toast-wrap{position:fixed;bottom:24px;left:24px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 18px;border-radius:var(--radius);font-size:13px;font-weight:500;background:#212529;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast.success{background:#2D6A4F}
.toast.error{background:#A32D2D}
.guide-overlay .modal{width:min(880px,100%);height:min(90vh,900px);padding:0;display:flex;flex-direction:column}
.guide-overlay .modal-hd{padding:14px 18px;margin-bottom:0;border-bottom:1px solid var(--border);flex-shrink:0}
.guide-overlay .modal-hd-actions{display:flex;align-items:center;gap:14px}
.guide-overlay .modal-hd-actions a{font-size:12px;color:var(--text2);text-decoration:none}
.guide-overlay .modal-hd-actions a:hover{color:var(--blue)}
.guide-overlay iframe{flex:1;width:100%;border:none;background:var(--bg2)}
.guide-card{background:var(--blue-bg);border-color:var(--border)}
.guide-card .card-meta{color:var(--blue)}
</style>
</head>
<body>
<div class="header">
  <div class="header-inner">
    <div class="header-top-row">
      <div>
        <h1>🏐 배구부 데이터 분석</h1>
        <p>내가 추가한 팀만 여기에 보여요. 팀 이름(또는 주소)과 코드를 아는 사람만 팀을 확인할 수 있어요.</p>
      </div>
      <button class="btn guide-btn" onclick="openGuide()">📖 사용설명서</button>
    </div>
    <div class="search-row">
      <input id="search" type="text" placeholder="내 팀 중에서 검색..." oninput="render()"/>
    </div>
  </div>
</div>
<div class="content">
  <div class="section-title">내 팀</div>
  <div class="grid" id="team-grid"></div>
</div>
<div class="actions">
  <button class="btn" onclick="openJoin()">+ 팀 추가</button>
  <button class="btn btn-p" onclick="openRegister()">+ 새 팀 만들기</button>
</div>
<div class="toast-wrap" id="toast-wrap"></div>

<div class="overlay" id="mo-join">
  <div class="modal">
    <div class="modal-hd"><span class="modal-title">내 팀 추가</span><button class="x-btn" onclick="closeJoin()">×</button></div>
    <div class="fgrp">
      <label>팀 이름 또는 URL 주소 *</label>
      <input id="join-identifier" placeholder="예: OO대학교 배구부 또는 oo-univ-vb" onkeydown="if(event.key==='Enter')gid('join-code').focus()"/>
    </div>
    <div class="fgrp">
      <label>팀 코드 *</label>
      <input id="join-code" type="password" placeholder="편집 비밀번호(코드)" onkeydown="if(event.key==='Enter')submitJoin()"/>
    </div>
    <div class="modal-ft"><button class="btn" onclick="closeJoin()">취소</button><button class="btn btn-p" id="join-save-btn" onclick="submitJoin()">추가하기</button></div>
  </div>
</div>

<div class="overlay" id="mo-register">
  <div class="modal">
    <div class="modal-hd"><span class="modal-title">새 팀 만들기</span><button class="x-btn" onclick="closeRegister()">×</button></div>
    <div class="fgrp">
      <label>팀/학교 이름 *</label>
      <input id="reg-name" placeholder="예: OO대학교 배구부" oninput="suggestSlug()"/>
    </div>
    <div class="fgrp">
      <label>팀 URL 주소 *</label>
      <input id="reg-slug" placeholder="예: oo-univ-vb"/>
      <div class="hint">team.html?team=<span id="slug-preview">여기</span> 형태로 접속하게 됩니다. 영문/숫자/하이픈 권장.</div>
    </div>
    <div class="fgrp">
      <label>편집 비밀번호(코드) * <span style="font-weight:400">4자 이상</span></label>
      <input id="reg-code" type="password" placeholder="선수 추가, 기록 입력 시 사용"/>
    </div>
    <div class="fgrp">
      <label>편집 비밀번호 확인 *</label>
      <input id="reg-code2" type="password" placeholder="다시 입력"/>
    </div>
    <div class="modal-ft"><button class="btn" onclick="closeRegister()">취소</button><button class="btn btn-p" id="reg-save-btn" onclick="submitRegister()">등록하고 시작하기</button></div>
  </div>
</div>

<div class="overlay guide-overlay" id="mo-guide">
  <div class="modal">
    <div class="modal-hd">
      <span class="modal-title">📖 사용설명서</span>
      <div class="modal-hd-actions">
        <a href="./guide.pdf" target="_blank" rel="noopener">새 탭에서 열기 ↗</a>
        <button class="x-btn" onclick="closeGuide()">×</button>
      </div>
    </div>
    <iframe src="./guide.pdf" title="사용설명서"></iframe>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://rrglljipaothpvswqzkm.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyZ2xsamlwYW90aHB2c3dxemttIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNDA0NjcsImV4cCI6MjEwMzgxNjQ2N30.53AN3JbmiKiTLB2RvqpWxgcz-8raIr0qpxpzIQHNtOI';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const MY_TEAMS_KEY = 'volleyball_my_teams';
const GUIDE_HIDDEN_KEY = 'volleyball_guide_card_hidden';

function gid(id){return document.getElementById(id);}

// ── 내가 추가한 팀 (이 브라우저에만 저장됨, 다른 팀 목록은 애초에 조회 불가) ──
function myTeams(){ try{ return JSON.parse(localStorage.getItem(MY_TEAMS_KEY)||'[]'); }catch(e){ return []; } }
function saveMyTeam(id, slug, name){
  let list = myTeams().filter(t=>t.id!==id);
  list.push({id, slug, name});
  localStorage.setItem(MY_TEAMS_KEY, JSON.stringify(list));
}
function removeMyTeamLocal(id, ev){
  if(ev){ ev.preventDefault(); ev.stopPropagation(); }
  if(!confirm('이 팀을 내 목록에서 제거할까요?\n(팀 자체가 삭제되는 것은 아니고, 이 브라우저의 목록에서만 사라져요. 다시 추가하려면 이름/주소와 코드가 필요해요.)')) return;
  const list = myTeams().filter(t=>t.id!==id);
  localStorage.setItem(MY_TEAMS_KEY, JSON.stringify(list));
  render();
}
// team.html이 다시 코드를 묻지 않도록, 이 탭 세션에 임시로 코드를 같이 넘겨준다.
function setTeamSession(slug, obj){
  try{ sessionStorage.setItem('team_session_'+String(slug||'').toLowerCase(), JSON.stringify(obj)); }catch(e){}
}

function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function cardHtml(t){
  return `<a class="card" href="./team.html?team=${encodeURIComponent(t.slug)}">
    <button class="remove-btn" onclick="removeMyTeamLocal('${t.id}', event)" title="목록에서 제거">×</button>
    <div class="card-name">${escapeHtml(t.name)}</div>
    <div class="card-meta">team.html?team=${escapeHtml(t.slug)}</div>
  </a>`;
}
function guideCardHtml(){
  return `<a class="card guide-card" href="#" onclick="openGuide();return false;">
    <button class="remove-btn" onclick="hideGuideCard(event)" title="목록에서 숨기기">×</button>
    <div class="card-name">📖 사용설명서</div>
    <div class="card-meta">사용법이 궁금하면 여기를 눌러보세요</div>
  </a>`;
}
function hideGuideCard(ev){
  if(ev){ ev.preventDefault(); ev.stopPropagation(); }
  try{ localStorage.setItem(GUIDE_HIDDEN_KEY, '1'); }catch(e){}
  render();
}

function render(){
  const q = (gid('search').value||'').trim().toLowerCase();
  const all = myTeams();
  const filtered = all.filter(t=>t.name.toLowerCase().includes(q));
  const teamsHtml = filtered.length
    ? filtered.map(cardHtml).join('')
    : `<div class="empty" style="grid-column:1/-1">${all.length===0 ? '아직 추가한 팀이 없어요.<br>오른쪽 아래 버튼으로 우리 팀을 추가하거나 새로 만들어보세요!' : '검색 결과가 없습니다.'}</div>`;
  let guideHidden = false;
  try{ guideHidden = localStorage.getItem(GUIDE_HIDDEN_KEY) === '1'; }catch(e){}
  gid('team-grid').innerHTML = (guideHidden ? '' : guideCardHtml()) + teamsHtml;
}

// ── 사용설명서 ──
function openGuide(){ gid('mo-guide').classList.add('open'); }
function closeGuide(){ gid('mo-guide').classList.remove('open'); }

// ── 내 팀 추가 (이미 있는 팀에 들어가기) ──
function openJoin(){
  gid('join-identifier').value=''; gid('join-code').value='';
  gid('mo-join').classList.add('open');
  gid('join-identifier').focus();
}
function closeJoin(){ gid('mo-join').classList.remove('open'); }
async function submitJoin(){
  const identifier = gid('join-identifier').value.trim();
  const code = gid('join-code').value;
  if(!identifier){ toast('팀 이름 또는 주소를 입력하세요.','error'); return; }
  if(!code){ toast('코드를 입력하세요.','error'); return; }
  const btn = gid('join-save-btn'); btn.textContent='확인 중...'; btn.disabled=true;
  const {data, error} = await sb.rpc('join_team', {p_identifier: identifier, p_code: code});
  btn.textContent='추가하기'; btn.disabled=false;
  if(error || !data || !data.length){ toast('팀 이름 또는 코드가 올바르지 않습니다.','error'); return; }
  const team = data[0];
  saveMyTeam(team.id, team.slug, team.name);
  setTeamSession(team.slug, {id:team.id, name:team.name, code});
  toast('팀이 추가되었습니다!','success');
  closeJoin();
  setTimeout(()=>{ location.href = './team.html?team='+encodeURIComponent(team.slug); }, 500);
}

// ── 새 팀 만들기 ──
function openRegister(){
  gid('reg-name').value=''; gid('reg-slug').value=''; gid('reg-code').value=''; gid('reg-code2').value='';
  gid('slug-preview').textContent='여기';
  gid('mo-register').classList.add('open');
}
function closeRegister(){ gid('mo-register').classList.remove('open'); }
function slugify(s){
  return String(s||'').trim().toLowerCase()
    .replace(/\s+/g,'-')
    .replace(/[^a-z0-9\-가-힣]/g,'')
    .replace(/-+/g,'-')
    .replace(/^-|-$/g,'');
}
function suggestSlug(){
  const s = slugify(gid('reg-name').value);
  gid('reg-slug').value = s;
  gid('slug-preview').textContent = s || '여기';
}
async function submitRegister(){
  const name = gid('reg-name').value.trim();
  let slug = slugify(gid('reg-slug').value || gid('reg-name').value);
  const code = gid('reg-code').value;
  const code2 = gid('reg-code2').value;
  if(!name){ toast('팀 이름을 입력하세요.','error'); return; }
  if(!slug){ toast('팀 URL 주소를 입력하세요.','error'); return; }
  if(code.length < 4){ toast('편집 코드는 4자 이상이어야 합니다.','error'); return; }
  if(code !== code2){ toast('편집 코드가 서로 다릅니다.','error'); return; }
  const btn = gid('reg-save-btn'); btn.textContent='등록 중...'; btn.disabled=true;
  const {data, error} = await sb.rpc('register_team', {p_name:name, p_slug:slug, p_code:code});
  btn.textContent='등록하고 시작하기'; btn.disabled=false;
  if(error){
    if(/duplicate|unique/i.test(error.message)) toast('이미 사용 중인 팀 URL 주소입니다. 다른 주소를 입력해주세요.','error');
    else toast('등록 실패: '+error.message,'error');
    return;
  }
  const team = data[0];
  saveMyTeam(team.id, team.slug, name);
  setTeamSession(team.slug, {id:team.id, name, code});
  toast('팀이 등록되었습니다!','success');
  closeRegister();
  setTimeout(()=>{ location.href = './team.html?team='+encodeURIComponent(team.slug); }, 600);
}

function toast(msg,type=''){
  const w=gid('toast-wrap');
  const t=document.createElement('div');t.className='toast'+(type?' '+type:'');t.textContent=msg;
  w.appendChild(t);setTimeout(()=>t.remove(),3000);
}

render();
</script>
</body>
</html>
