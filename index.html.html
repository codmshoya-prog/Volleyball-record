<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>배구부 데이터 분석 - 팀 찾기</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f8f9fa;--bg3:#f1f3f5;
  --text:#212529;--text2:#6c757d;--text3:#adb5bd;
  --border:rgba(0,0,0,.10);--border2:rgba(0,0,0,.18);
  --blue:#185FA5;--blue-bg:#E6F1FB;
  --amber:#854F0B;--amber-bg:#FAEEDA;
  --red:#A32D2D;--red-bg:#FCEBEB;
  --radius:8px;--radius-lg:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;background:var(--bg3);color:var(--text);font-size:14px}
.header{background:var(--bg);border-bottom:1px solid var(--border);padding:32px 24px}
.header-inner{max-width:960px;margin:0 auto}
.header h1{font-size:24px;font-weight:700;margin-bottom:6px}
.header p{font-size:14px;color:var(--text2);margin-bottom:20px}
.search-row{display:flex;gap:10px}
.search-row input{flex:1;font-size:14px;padding:11px 14px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg2);color:var(--text)}
.search-row input:focus{outline:2px solid var(--blue);outline-offset:1px}
.btn{padding:10px 18px;font-size:13px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg);color:var(--text);cursor:pointer;font-weight:600;transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--bg2)}
.btn-p{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn-p:hover{opacity:.85}
.content{max-width:960px;margin:0 auto;padding:28px 16px 60px}
.section-title{font-size:14px;font-weight:700;color:var(--text2);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:32px}
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;cursor:pointer;transition:box-shadow .15s,border-color .15s;position:relative;text-decoration:none;color:inherit;display:block}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);border-color:var(--border2)}
.card-name{font-size:15px;font-weight:700;margin-bottom:4px;padding-right:28px}
.card-meta{font-size:12px;color:var(--text3)}
.star-btn{position:absolute;top:14px;right:14px;background:none;border:none;font-size:18px;cursor:pointer;color:var(--text3);line-height:1;padding:2px}
.star-btn.on{color:#E8A93C}
.empty{text-align:center;padding:50px 20px;color:var(--text3);font-size:14px}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:50px;color:var(--text2)}
.spinner{width:20px;height:20px;border:2px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fab{position:fixed;bottom:28px;right:28px;z-index:100}
.fab button{padding:14px 22px;font-size:14px;border-radius:99px;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex}
.modal{background:var(--bg);border-radius:var(--radius-lg);width:min(440px,100%);padding:24px;box-shadow:0 8px 40px rgba(0,0,0,.18)}
.modal-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-title{font-size:16px;font-weight:700}
.x-btn{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text2);line-height:1}
.fgrp{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fgrp label{font-size:12px;font-weight:600;color:var(--text2)}
.fgrp input{font-size:13px;padding:9px 11px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg2);color:var(--text);width:100%}
.fgrp input:focus{outline:2px solid var(--blue);outline-offset:1px}
.fgrp .hint{font-size:11px;color:var(--text3);margin-top:2px}
.modal-ft{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border)}
.toast-wrap{position:fixed;bottom:24px;left:24px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 18px;border-radius:var(--radius);font-size:13px;font-weight:500;background:#212529;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast.success{background:#2D6A4F}
.toast.error{background:#A32D2D}
</style>
</head>
<body>
<div class="header">
  <div class="header-inner">
    <h1>🏐 배구부 데이터 분석</h1>
    <p>팀을 검색하거나 즐겨찾기에서 빠르게 찾아보세요.</p>
    <div class="search-row">
      <input id="search" type="text" placeholder="팀/학교 이름으로 검색..." oninput="render()"/>
    </div>
  </div>
</div>
<div class="content">
  <div id="fav-section" style="display:none">
    <div class="section-title">⭐ 즐겨찾기</div>
    <div class="grid" id="fav-grid"></div>
  </div>
  <div class="section-title">전체 팀</div>
  <div class="grid" id="team-grid"><div class="loading"><div class="spinner"></div>불러오는 중...</div></div>
</div>
<div class="fab"><button class="btn btn-p" onclick="openRegister()">+ 팀 등록</button></div>
<div class="toast-wrap" id="toast-wrap"></div>

<div class="overlay" id="mo-register">
  <div class="modal">
    <div class="modal-hd"><span class="modal-title">새 팀 등록</span><button class="x-btn" onclick="closeRegister()">×</button></div>
    <div class="fgrp">
      <label>팀/학교 이름 *</label>
      <input id="reg-name" placeholder="예: OO대학교 배구부" oninput="suggestSlug()"/>
    </div>
    <div class="fgrp">
      <label>팀 URL 주소 *</label>
      <input id="reg-slug" placeholder="예: oo-univ-vb"/>
      <div class="hint">team.html?team=<span id="slug-preview">여기</span> 형태로 접속하게 됩니다. 영문/숫자/하이픈 권장.</div>
    </div>
    <div class="fgrp">
      <label>편집 비밀번호(코드) * <span style="font-weight:400">4자 이상</span></label>
      <input id="reg-code" type="password" placeholder="선수 추가, 기록 입력 시 사용"/>
    </div>
    <div class="fgrp">
      <label>편집 비밀번호 확인 *</label>
      <input id="reg-code2" type="password" placeholder="다시 입력"/>
    </div>
    <div class="modal-ft"><button class="btn" onclick="closeRegister()">취소</button><button class="btn btn-p" id="reg-save-btn" onclick="submitRegister()">등록하고 시작하기</button></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://rrglljipaothpvswqzkm.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyZ2xsamlwYW90aHB2c3dxemttIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNDA0NjcsImV4cCI6MjEwMzgxNjQ2N30.53AN3JbmiKiTLB2RvqpWxgcz-8raIr0qpxpzIQHNtOI';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let teams = [];
const FAV_KEY = 'volleyball_favorite_teams';

function gid(id){return document.getElementById(id);}
function getFavs(){ try{ return JSON.parse(localStorage.getItem(FAV_KEY)||'[]'); }catch(e){ return []; } }
function setFavs(arr){ localStorage.setItem(FAV_KEY, JSON.stringify(arr)); }
function isFav(id){ return getFavs().includes(id); }
function toggleFav(id, ev){
  if(ev){ ev.preventDefault(); ev.stopPropagation(); }
  let favs = getFavs();
  if(favs.includes(id)) favs = favs.filter(x=>x!==id);
  else favs.push(id);
  setFavs(favs);
  render();
}

function cardHtml(t){
  const fav = isFav(t.id);
  return `<a class="card" href="./team.html?team=${encodeURIComponent(t.slug)}">
    <button class="star-btn ${fav?'on':''}" onclick="toggleFav('${t.id}', event)" title="즐겨찾기">${fav?'★':'☆'}</button>
    <div class="card-name">${escapeHtml(t.name)}</div>
    <div class="card-meta">team.html?team=${escapeHtml(t.slug)}</div>
  </a>`;
}
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render(){
  const q = (gid('search').value||'').trim().toLowerCase();
  const filtered = teams.filter(t=>t.name.toLowerCase().includes(q));
  const favIds = getFavs();
  const favTeams = filtered.filter(t=>favIds.includes(t.id));
  const restTeams = filtered.filter(t=>!favIds.includes(t.id));

  gid('fav-section').style.display = favTeams.length ? 'block' : 'none';
  gid('fav-grid').innerHTML = favTeams.map(cardHtml).join('');

  gid('team-grid').innerHTML = restTeams.length
    ? restTeams.map(cardHtml).join('')
    : (filtered.length===0 ? `<div class="empty" style="grid-column:1/-1">${q?'검색 결과가 없습니다.':'등록된 팀이 없습니다. 첫 팀을 등록해보세요!'}</div>` : '');
}

async function loadTeams(){
  const {data, error} = await sb.from('teams').select('id,name,slug,created_at').order('created_at',{ascending:true});
  if(error){ gid('team-grid').innerHTML = '<div class="empty" style="grid-column:1/-1">팀 목록을 불러오지 못했습니다.</div>'; return; }
  teams = data || [];
  render();
}

function openRegister(){
  gid('reg-name').value=''; gid('reg-slug').value=''; gid('reg-code').value=''; gid('reg-code2').value='';
  gid('slug-preview').textContent='여기';
  gid('mo-register').classList.add('open');
}
function closeRegister(){ gid('mo-register').classList.remove('open'); }
function slugify(s){
  return String(s||'').trim().toLowerCase()
    .replace(/\s+/g,'-')
    .replace(/[^a-z0-9\-가-힣]/g,'')
    .replace(/-+/g,'-')
    .replace(/^-|-$/g,'');
}
function suggestSlug(){
  const s = slugify(gid('reg-name').value);
  gid('reg-slug').value = s;
  gid('slug-preview').textContent = s || '여기';
}
async function submitRegister(){
  const name = gid('reg-name').value.trim();
  let slug = slugify(gid('reg-slug').value || gid('reg-name').value);
  const code = gid('reg-code').value;
  const code2 = gid('reg-code2').value;
  if(!name){ toast('팀 이름을 입력하세요.','error'); return; }
  if(!slug){ toast('팀 URL 주소를 입력하세요.','error'); return; }
  if(code.length < 4){ toast('편집 코드는 4자 이상이어야 합니다.','error'); return; }
  if(code !== code2){ toast('편집 코드가 서로 다릅니다.','error'); return; }
  const btn = gid('reg-save-btn'); btn.textContent='등록 중...'; btn.disabled=true;
  const {data, error} = await sb.rpc('register_team', {p_name:name, p_slug:slug, p_code:code});
  btn.textContent='등록하고 시작하기'; btn.disabled=false;
  if(error){
    if(/duplicate|unique/i.test(error.message)) toast('이미 사용 중인 팀 URL 주소입니다. 다른 주소를 입력해주세요.','error');
    else toast('등록 실패: '+error.message,'error');
    return;
  }
  toast('팀이 등록되었습니다!','success');
  setTimeout(()=>{ location.href = './team.html?team='+encodeURIComponent(slug); }, 600);
}
function toast(msg,type=''){
  const w=gid('toast-wrap');
  const t=document.createElement('div');t.className='toast'+(type?' '+type:'');t.textContent=msg;
  w.appendChild(t);setTimeout(()=>t.remove(),3000);
}

loadTeams();
</script>
</body>
</html>
